name: MENTRIX AI research reproducibility
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-package-tests:
    name: Current code tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python REPRODUCE_PHASE1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-audit-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
