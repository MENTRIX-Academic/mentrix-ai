<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MENTRIX | Student Check-in</title><link rel="stylesheet" href="/static/workspace.css"></head><body><div class="login-screen"><div class="login-box"><div class="brand-mark">M</div><div class="eyebrow">STUDENT CHECK-IN</div><h1>Attendance check-in</h1><p>Use your Student ID and PIN, then confirm your session QR.</p><form id="login" class="stack"><label>Student ID<input id="id" required placeholder="ST001" autocomplete="username"></label><label>PIN<input id="pin" required type="password" minlength="6" placeholder="6-digit student PIN" autocomplete="current-password"></label><button class="btn primary" type="submit">Sign in</button></form><p id="loginStatus" class="message"></p><form id="scan" class="stack" hidden><label>Session ID<input id="sid" required placeholder="AT-..."></label><label>Rotating QR token<input id="token" required placeholder="Scan the QR or open its link"></label><button class="btn primary" type="submit">Confirm attendance</button><button class="btn outline" type="button" id="signout">Sign out</button></form><p id="scanStatus" class="message"></p><small>Mock-data research demo. ST001 / 740001 for local testing. Sharing a QR is not proof of physical presence; TA checks remain required.</small></div></div>
<script>const el=x=>document.getElementById(x);const qs=new URLSearchParams(location.search);el('sid').value=qs.get('session')||'';el('token').value=qs.get('token')||'';async function req(url,body){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}async function check(){let r=await fetch('/api/student/session');let d=await r.json();el('scan').hidden=!d.authenticated;el('login').hidden=d.authenticated;if(d.authenticated)el('loginStatus').textContent='Signed in as '+d.student_id}el('login').onsubmit=async e=>{e.preventDefault();try{let d=await req('/api/student/login',{student_id:el('id').value,pin:el('pin').value});el('loginStatus').textContent='Signed in as '+d.student_id;await check()}catch(e){el('loginStatus').textContent=e.message}};el('scan').onsubmit=async e=>{e.preventDefault();try{let d=await req('/api/student/checkin',{session_id:el('sid').value,token:el('token').value});el('scanStatus').textContent='Check-in recorded: '+d.status+(d.already_registered?' (previously recorded)':'')}catch(e){el('scanStatus').textContent=e.message}};el('signout').onclick=async()=>{await req('/api/student/logout',{});await check()};check();</script></body></html>
