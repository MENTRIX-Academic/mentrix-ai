
name: MENTRIX Python Checks

on:
  push:
    branches:
      - master
      - chore/repository-organization

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-syntax:
    name: Python Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check MENTRIX Python syntax
        run: python -m compileall -q MENTRIX
